services:
  web:
    build: .

    ports:
      - "127.0.0.1:8001:8000"

    env_file:
      - .env

    environment:
      SQLITE_PATH: /data/db.sqlite3

    volumes:
      - .:/app
      - sqlite_data:/data

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  sqlite_data: